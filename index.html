}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:Arial,Helvetica,sans-serif;
background:radial-gradient(circle at 50% 0%,#263e52 0,#0c141e 38%,#04070b 85%)}
button{cursor:pointer;font:inherit} .hero{min-height:430px;display:grid;place-items:center;text-align:center;
border-bottom:2px solid var(--gold);position:relative;overflow:hidden;
background:linear-gradient(rgba(2,8,15,.25),rgba(2,7,13,.88)),radial-gradient(ellipse at 50% 35%,rgba(91,154,204,.55),transparent 55%),linear-gradient(135deg,#07101a,#1b3b58,#07101a)}
.hero:after{position:absolute;font-size:420px;opacity:.04;right:5%;top:-90px}
.hero-content{position:relative;z-index:2;padding:25px}.hero-kicker{color:#78b9e8;letter-spacing:4px;font-weight:bold;font-size:14px}
.hero-title{margin:15px 0 0;font:900 clamp(52px,9vw,108px)/1 Georgia,serif;letter-spacing:4px;text-transform:uppercase;text-shadow:0 5px 18px #000}
.hero-line{width:min(600px,80%);height:2px;margin:20px auto;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent)}
.hero-subtitle{margin:0;color:var(--gold2);font:700 clamp(20px,3vw,34px) Georgia,serif;letter-spacing:4px;text-transform:uppercase}
.hero-description{color:#d4e5f2;letter-spacing:2px}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px 14px;background:rgba(5,10,16,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav-main{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin:0}
.nav-admin{display:flex;align-items:center;flex:0 0 auto;margin-left:0;padding-left:0;border-left:0}
nav button,.btn{border:1px solid #354656;border-radius:6px;padding:10px 15px;color:#eee;background:#17232f;transition:.2s}
nav button:hover,.btn:hover{transform:translateY(-1px)}nav button:hover,.btn-primary{background:var(--gold);color:#111;border-color:var(--gold)}
.nav-separator{width:1px;height:30px;background:linear-gradient(to bottom,transparent,rgba(216,173,75,.55),transparent);margin:0 8px;flex:0 0 1px}
.nav-manage{margin-left:0;background:#20313d;border-color:#59636a;color:#cfe4ec}
.nav-manage:hover{background:#294554!important;border-color:#59636a !important;color:#fff!important}
.nav-admin button{background:#202a31;border-color:#59636a;color:#d7dde1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}
.nav-admin button:hover{background:#2b343a!important;border-color:#59636a!important;color:#fff!important}
.admin-only{display:none!important}.admin-only.admin-visible{display:inline-block!important}

.btn-secondary{background:#364653;color:#fff}.btn-green{background:var(--green);color:#fff}.btn-danger{background:var(--red);color:#fff}.btn-small{padding:7px 10px;font-size:12px}
main{width:min(1280px,94%);margin:40px auto 80px}section{margin-bottom:70px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.section-title h2{margin:0;color:var(--gold);font:700 28px Georgia,serif}
.news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;align-items:stretch}
.news-card,.raid-card,.event-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 15px 45px rgba(0,0,0,.45)}
.news-card{padding:20px;border-left:4px solid var(--gold);height:100%;display:flex;flex-direction:column}.news-card h3{margin-top:0;color:var(--gold)}.news-date,.muted{color:var(--muted);font-size:13px}
.news-text,.card-description{white-space:pre-wrap;line-height:1.6}
.news-text .news-link{color:#78b9e8;text-decoration:underline;text-decoration-color:rgba(120,185,232,.55);font-weight:600;word-break:break-word}
.news-text .news-link:hover{color:var(--gold2);text-decoration-color:var(--gold2)}
.news-editor-help{margin-top:8px;padding:10px 12px;border:1px solid rgba(216,173,75,.22);border-radius:6px;background:rgba(216,173,75,.06);color:#9daab5;font-size:12px;line-height:1.55}
.news-editor-help strong{color:var(--gold2)}
.news-video{margin:0;padding:0;border:0;border-radius:0;background:transparent;max-width:100%;box-sizing:border-box}
.news-video-label{display:none}
.news-video-frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:0;background:#000}
.news-video-preview{position:absolute;inset:0;display:block;overflow:hidden;background:#000}
.news-video-preview img{width:100%;height:100%;object-fit:cover;display:block}
.news-video-preview::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.5));pointer-events:none}
.news-video-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:45px;border-radius:12px;background:rgba(255,0,0,.92);color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;padding-left:3px;box-shadow:0 4px 18px rgba(0,0,0,.45);z-index:2}
.news-video-local{background:#000}
.news-video-local-note{margin-top:6px;color:#8d98a3;font-size:11px;line-height:1.35}
.news-video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:20px;background:linear-gradient(135deg,#1a2b3a,#111b25);border-bottom:1px solid var(--border)}
.card-title{color:var(--gold);font:700 25px Georgia,serif}.card-meta{margin-top:7px;color:#aaa;line-height:1.8}.card-body{padding:20px}
.countdown{margin:18px 0;padding:16px;text-align:center;background:linear-gradient(135deg,#252015,#101920);border:1px solid #806229;border-radius:8px}
.countdown-title{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:2px}.countdown-value{font-size:clamp(20px,4vw,34px);font-weight:bold}.countdown-value span{color:var(--gold2)}.started{color:#ed5d5d}
.role-grid,.requirements,.limit-box{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.requirements,.limit-box{grid-template-columns:repeat(3,1fr)}
.role-box,.requirement,.limit-item{padding:13px;text-align:center;background:#0c141c;border:1px solid var(--border);border-radius:6px}
.role-number,.requirement strong,.limit-item strong{display:block;font-size:25px;margin-bottom:4px}.tank .role-number,.tank strong,.limit-tank strong{color:#e1a45e}.heal .role-number,.heal strong,.limit-heal strong{color:#55d394}.dd .role-number,.dd strong,.limit-dd strong{color:#df6565}.free .role-number{color:#65a8df}
.progress-label{display:flex;justify-content:space-between;margin-bottom:6px;color:#aaa}.progress{height:13px;overflow:hidden;margin-bottom:20px;background:#070a0e;border-radius:20px}.progress-bar{height:100%;background:linear-gradient(90deg,#9a7021,var(--gold2));transition:.3s}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.player-card{position:relative;padding:13px;background:#10171e;border:1px solid var(--border);border-radius:6px}.player-card strong{display:block;margin-bottom:5px}.player-card small{display:block;margin-top:4px;color:#aaa}.empty-slot{color:#68737e}.remove-player{position:absolute;top:5px;right:5px;border:0;background:none;color:#999;font-size:20px}.remove-player:hover{color:#ff6464}
.modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;background:#000c}.modal.active{display:flex}.modal-box{width:min(700px,100%);max-height:93vh;overflow:auto;position:relative;padding:25px;background:#17212b;border:1px solid #56636f;border-top:4px solid var(--gold);border-radius:8px}.modal-box h2{margin-top:0;color:var(--gold);font-family:Georgia,serif}.close-modal{position:absolute;top:6px;right:10px;border:0;background:none;color:#aaa;font-size:28px}.form-group{margin:15px 0}.form-group label{display:block;margin-bottom:6px;color:#bbb}input,select,textarea{width:100%;padding:11px;color:#fff;background:#0a1016;border:1px solid #414d59;border-radius:5px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold)}textarea{min-height:100px;resize:vertical}.form-row,.role-limit-form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.role-limit-form{grid-template-columns:repeat(3,1fr)}.modal-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:20px}
.signup-status-help{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
.status-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.status-group{padding:12px;background:#0c141c;border:1px solid var(--border);border-radius:6px}
.status-group h4{margin:0 0 10px;color:var(--gold)}
.status-group.absent h4{color:#aab4bd}
.status-group.bench h4{color:#e1a45e}
.status-group.uncertain h4{color:#65a8df}
.status-player{padding:7px 0;border-bottom:1px solid #26333f;font-size:13px}
.status-player:last-child{border-bottom:0}
.status-actions{display:inline-flex;gap:4px;margin-left:7px;vertical-align:middle}
.status-action{border:1px solid #35495b;border-radius:4px;background:#17232f;color:#ddd;padding:2px 5px;font-size:12px;line-height:1;cursor:pointer}
.status-action:hover{border-color:var(--gold);transform:translateY(-1px)}

@media(max-width:800px){.status-groups{grid-template-columns:1fr}.modal-actions .btn{min-height:40px}}
.toast{position:fixed;left:50%;bottom:25px;z-index:2000;padding:13px 20px;color:#fff;background:#222c36;border:1px solid var(--gold);border-radius:6px;opacity:0;transform:translate(-50%,30px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
.admin-status{position:fixed;right:15px;bottom:15px;z-index:900;display:none;padding:10px 14px;color:#fff;background:#2e783f;border-radius:5px;font-size:13px;font-weight:bold}.admin-status.active{display:block}
footer{padding:45px 20px;text-align:center;color:#777;border-top:1px solid var(--border)}footer strong{color:var(--gold)}
@media(max-width:800px){.section-title,.card-header{flex-direction:column;align-items:flex-start}.role-grid,.requirements,.limit-box,.role-limit-form,.form-row{grid-template-columns:1fr 1fr}}
@media(max-width:500px){
  .hero{min-height:300px;padding:20px 12px}
  .hero-content{padding:10px}
  .hero-kicker{font-size:10px;letter-spacing:1.5px;line-height:1.4}
  .hero-title{font-size:clamp(38px,14vw,58px);letter-spacing:2px;margin-top:10px}
  .hero-line{width:75%;margin:12px auto}
  .hero-subtitle{font-size:clamp(15px,5vw,22px);letter-spacing:1.5px}
  .hero-description{font-size:12px;letter-spacing:.5px;margin:10px 0 0}
  nav{gap:8px;padding:7px 5px}
  .nav-main{gap:6px}
  .nav-admin{margin-left:0;padding-left:0}
  .nav-separator{height:24px;margin:0 6px}
  nav button{padding:7px 9px;font-size:12px}
  main{width:calc(100% - 20px);margin:25px auto 50px}
  section{margin-bottom:45px}
  .section-title{gap:10px}
  .section-title h2{font-size:22px}
  .section-title .btn{width:100%;padding:9px 10px}
  .role-grid,.requirements,.limit-box,.role-limit-form,.form-row{grid-template-columns:1fr}
  .weekdays div{font-size:10px;padding:8px 2px}
  .card-header,.card-body,.news-card{padding:15px}
  .card-title{font-size:21px}
}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* =========================================================
   KINDKÖPFE – ONLINE VERSION
   Datenbank: Supabase
   ---------------------------------------------------------
   1. SUPABASE_URL eintragen
   2. SUPABASE_PUBLISHABLE_KEY eintragen
   3. SQL-Datei einmal im Supabase SQL Editor ausführen
   4. Admin-Benutzer in Supabase Auth anlegen
   ========================================================= */
const SUPABASE_URL = "https://lljhicrxjhfmddclyjme.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_sS-deTm_y0JaocBmRo8DvQ_hUBY1QyY";

const wowClasses={
 "Todesritter":[["Blut","Tank"],["Frost","DD"],["Unheilig","DD"]],
 "Druide":[["Gleichgewicht","DD"],["Wildheit","DD"],["Wächter","Tank"],["Wiederherstellung","Heiler"]],
 "Jäger":[["Tierherrschaft","DD"],["Treffsicherheit","DD"],["Überleben","DD"]],
 "Magier":[["Arkan","DD"],["Feuer","DD"],["Frost","DD"]],
 "Mönch":[["Braumeister","Tank"],["Nebelwirker","Heiler"],["Windläufer","DD"]],
 "Paladin":[["Heilig","Heiler"],["Schutz","Tank"],["Vergeltung","DD"]],
 "Priester":[["Disziplin","Heiler"],["Heilig","Heiler"],["Schatten","DD"]],
 "Schurke":[["Meucheln","DD"],["Kampf","DD"],["Täuschung","DD"]],
 "Schamane":[["Elementar","DD"],["Verstärkung","DD"],["Wiederherstellung","Heiler"]],
 "Hexenmeister":[["Gebrechen","DD"],["Dämonologie","DD"],["Zerstörung","DD"]],
 "Krieger":[["Waffen","DD"],["Furor","DD"],["Schutz","Tank"]]
};

let supabaseClient=null;
let news=[],raids=[],events=[];
let isAdmin=false;

function configured(){return !SUPABASE_URL.startsWith("DEINE_")&&!SUPABASE_PUBLISHABLE_KEY.startsWith("DEIN_");}
function initSupabase(){
 if(!configured()) return false;
 supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
 return true;
}
function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function formatDate(date){const d=new Date(date+"T12:00:00");return Number.isNaN(d.getTime())?date:d.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});}
function getStartDate(item){
    if(!item || !item.date) return new Date(NaN);

    const date = String(item.date).trim();
    const time = String(item.time || "00:00").trim().slice(0,5);

    const d = new Date(`${date}T${time}:00`);

    return d;
}
function scrollToSection(id){document.getElementById(id)?.scrollIntoView({behavior:"smooth"});}
function openModal(html){const box=document.querySelector("#modal .modal-box");box.classList.toggle("rk-wide-modal",html.includes("rk-modal"));document.getElementById("modalContent").innerHTML=html;document.getElementById("modal").classList.add("active");}
function closeModal(){document.getElementById("modal").classList.remove("active");document.getElementById("modalContent").innerHTML="";document.querySelector("#modal .modal-box").classList.remove("rk-wide-modal");}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove("show"),2500);}
function dbError(error){console.error("Supabase-Fehler:",error);const msg=error?.message||error?.details||error?.hint||"Unbekannter Datenbankfehler";showToast("❌ "+msg);alert("Supabase-Fehler:\n\n"+msg+(error?.details?"\n\nDetails: "+error.details:"")+(error?.hint?"\n\nHinweis: "+error.hint:""));}

async function refreshData(){
 if(!supabaseClient)return;
 const [n,r,e,s] = await Promise.all([
  supabaseClient.from("news").select("*").order("created_at",{ascending:false}),
  supabaseClient.from("raids").select("*").order("date",{ascending:true}).order("time",{ascending:true}),
  supabaseClient.from("events").select("*").order("date",{ascending:true}).order("time",{ascending:true}),
  supabaseClient.rpc("get_public_signups")
 ]);
 for(const x of [n,r,e,s]) if(x.error){dbError(x.error);return;}
 news=n.data||[];raids=r.data||[];events=e.data||[];
 const signups=(s.data||[]).map(p=>({...p,status:p.status||"confirmed"}));
 raids.forEach(x=>x.players=signups.filter(p=>p.item_type==="raid"&&p.item_id===x.id));
 events.forEach(x=>x.players=signups.filter(p=>p.item_type==="event"&&p.item_id===x.id));
 renderAll();
}

async function init(){
  if(!initSupabase()){
   document.getElementById("newsContainer").innerHTML='<div class="news-card"><h3>⚠️ Supabase noch nicht eingerichtet</h3><div class="news-text">Bitte SUPABASE_URL und SUPABASE_PUBLISHABLE_KEY im Script prüfen und anschließend die SQL-Datei im Supabase SQL Editor ausführen.</div></div>';
   renderNews();renderRaids();renderEvents();renderAll();return;
  }
  try{
    const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();
    if(sessionError) throw sessionError;
    await updateAdminState(session);
    await refreshData();
    supabaseClient.auth.onAuthStateChange(async (_event,session)=>{
      try{
        await updateAdminState(session);
        await refreshData();
      }catch(error){dbError(error);}
    });
  }catch(error){
    console.error(error);
    dbError(error);
    document.getElementById("newsContainer").innerHTML='<div class="news-card"><h3>❌ Verbindung zu Supabase fehlgeschlagen</h3><div class="news-text">Prüfe URL/Publishable Key, ob das SQL erfolgreich ausgeführt wurde und ob die RLS-Policies vorhanden sind.</div></div>';
  }
}
async function updateAdminState(session){
 if(!session){
  isAdmin=false;
  updateAdminStatus();
  return;
 }
 const {data,error}=await supabaseClient.rpc("is_admin");
 if(error){
  console.error("Admin-Prüfung is_admin:",error);
  isAdmin=false;
  updateAdminStatus();
  showToast("❌ Admin-Berechtigung konnte nicht geprüft werden.");
  return;
 }
 isAdmin=data === true;
 updateAdminStatus();
 if(!isAdmin) showToast("⚠️ Eingeloggt, aber keine Adminrechte.");
}
function updateAdminStatus(){
  const el=document.getElementById("adminStatus");
  el.textContent=isAdmin?"🔐 Admin-Modus aktiv":"🔓 Eingeloggt – keine Adminrechte";
  el.classList.toggle("active",isAdmin);
  document.querySelectorAll(".admin-only").forEach(el=>el.classList.toggle("admin-visible",isAdmin));
}

/* ===== ADMIN AUTH ===== */
async function openAdminLogin(){
 if(isAdmin){await supabaseClient.auth.signOut();showToast("🔐 Admin-Modus beendet.");return;}
 openModal(`<h2>🔐 Admin Login</h2>
 <div class="form-group"><label>Admin-E-Mail</label><input id="adminEmail" type="email" autocomplete="username"></div>
 <div class="form-group"><label>Passwort</label><input id="adminPassword" type="password" autocomplete="current-password"></div>
 <p class="muted">Der Admin-Zugang läuft über Supabase Auth. Das Passwort wird nicht in dieser HTML-Datei gespeichert.</p>
 <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button><button class="btn btn-primary" onclick="loginAdmin()">Einloggen</button></div>`);
}
async function loginAdmin(){
 const email=document.getElementById("adminEmail")?.value.trim(),password=document.getElementById("adminPassword")?.value||"";
 if(!email||!password){alert("Bitte E-Mail und Passwort eingeben.");return;}
 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error){alert("Login fehlgeschlagen: "+error.message);return;}
 closeModal();
 await updateAdminState(data.session);
 if(isAdmin) showToast("🔐 Admin-Modus aktiviert.");
}
/* ===== NEWS ===== */
function openNewsForm(id=null){
  if(!isAdmin){alert("Nur der Admin kann News erstellen oder bearbeiten.");return;}
  const n=id===null?null:news.find(x=>x.id===id);
  if(id!==null&&!n)return;
  openModal(`<h2>📰 ${n?"News bearbeiten":"News erstellen"}</h2>
    <div class="form-group"><label>Überschrift *</label><input id="newsTitle" value="${n?escapeHTML(n.title):""}"></div>
    <div class="form-group">
      <label>Nachricht *</label>
      <textarea id="newsText" placeholder="Text schreiben...&#10;&#10;Link: https://example.de&#10;Beschrifteter Link: [Zur Webseite](https://example.de)&#10;&#10;YouTube-Links werden automatisch als Videoplayer angezeigt.">${n?escapeHTML(n.text):""}</textarea>
      <div class="news-editor-help">
        <strong>🔗 Links:</strong> URL einfach einfügen – sie wird anklickbar.<br>
        <strong>▶️ YouTube:</strong> YouTube-Links werden automatisch als Videoplayer eingebunden.
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveNews(${id===null?"null":id})">💾 ${n?"Änderungen speichern":"Veröffentlichen"}</button>
    </div>`);
}

function getYouTubeId(url){
  try{
    const u=new URL(url.trim());
    const host=u.hostname.toLowerCase().replace(/^www\./,'');
    if(host==='youtu.be'){
      return u.pathname.split('/').filter(Boolean)[0] || null;
    }
    if(host==='youtube.com' || host==='m.youtube.com'){
      if(u.pathname==='/watch') return u.searchParams.get('v') || null;
      if(u.pathname.startsWith('/shorts/')) return u.pathname.split('/').filter(Boolean)[1] || null;
      if(u.pathname.startsWith('/embed/')) return u.pathname.split('/').filter(Boolean)[1] || null;
    }
  }catch(e){}
  return null;
}

function safeNewsUrl(raw){
  try{
    const u=new URL(raw.trim());
    return (u.protocol==='http:' || u.protocol==='https:') ? u.href : null;
  }catch(e){return null;}
}

function renderNewsContent(raw){
  // NEWS ONLY: URLs werden verarbeitet. YouTube-Player werden bewusst
  // NICHT als HTML-String erzeugt, sondern später per DOM erstellt.
  // Dadurch kann der iframe nicht versehentlich als Text erscheinen.
  const source=String(raw ?? '');
  const urlRegex=/(https?:\/\/[^\s<]+)/gi;
  let html='';
  let last=0;
  let m;

  while((m=urlRegex.exec(source))){
    html += escapeHTML(source.slice(last,m.index));

    let rawUrl=m[1];
    let trailing='';
    while(/[.,!?;:]$/.test(rawUrl)){
      trailing=rawUrl.slice(-1)+trailing;
      rawUrl=rawUrl.slice(0,-1);
    }

    const clean=safeNewsUrl(rawUrl);
    const yt=clean ? getYouTubeId(clean) : null;

    if(yt){
      html += `
        <div class="news-video" data-youtube-id="${escapeHTML(yt)}">
          <div class="news-video-label">▶️ YouTube</div>
          <div class="news-video-frame"></div>
        </div>`;
    }else if(clean){
      html += `<a class="news-link" href="${escapeHTML(clean)}" target="_blank" rel="noopener noreferrer">${escapeHTML(clean)}</a>`;
    }else{
      html += escapeHTML(m[1]);
    }

    html += escapeHTML(trailing);
    last=m.index+m[1].length;
  }

  html += escapeHTML(source.slice(last));
  return html.replace(/\r?\n/g,'<br>');
}

function activateNewsYouTubePlayers(container){
  container.querySelectorAll('.news-video[data-youtube-id]').forEach(card=>{
    const id=card.getAttribute('data-youtube-id');
    const frame=card.querySelector('.news-video-frame');
    if(!id || !frame || frame.dataset.ready==='1') return;

    // Bei einer lokal per file:// geöffneten HTML-Datei kann YouTube
    // den Embed-Player mit Fehler 153 ablehnen. Das ist eine Einschränkung
    // von YouTube, nicht der News-Funktion. Auf einer HTTPS-Seite wird
    // unten immer der echte Player verwendet.
    const isHttpPage = location.protocol === 'http:' || location.protocol === 'https:';

    if(!isHttpPage){
      frame.classList.add('news-video-local');
      frame.innerHTML = `
        <a class="news-video-preview" href="https://www.youtube.com/watch?v=${encodeURIComponent(id)}" target="_blank" rel="noopener noreferrer">
          <img src="https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg" alt="YouTube Video Vorschau" loading="lazy">
          <span class="news-video-play">▶</span>
        </a>
        <div class="news-video-local-note">Der direkte YouTube-Player funktioniert auf der veröffentlichten HTTPS-Seite.</div>`;
      frame.dataset.ready='1';
      return;
    }

    const iframe=document.createElement('iframe');
    const origin = encodeURIComponent(location.origin);
    iframe.src=`https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0&playsinline=1&origin=${origin}`;
    iframe.title='YouTube Video';
    iframe.loading='lazy';
    iframe.setAttribute('allow','accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
    iframe.setAttribute('allowfullscreen','');
    // YouTube verlangt für eingebettete Wiedergabe einen HTTP-Referer.
    iframe.referrerPolicy='strict-origin-when-cross-origin';

    frame.appendChild(iframe);
    frame.dataset.ready='1';
  });
}

function getNewsYouTubeIds(raw){
  const source=String(raw ?? '');
  const urlRegex=/(https?:\/\/[^\s<]+)/gi;
  const ids=[];
  let m;

  while((m=urlRegex.exec(source))){
    let rawUrl=m[1];
    while(/[.,!?;:]$/.test(rawUrl)) rawUrl=rawUrl.slice(0,-1);
    const clean=safeNewsUrl(rawUrl);
    const yt=clean ? getYouTubeId(clean) : null;
    if(yt && !ids.includes(yt)) ids.push(yt);
  }
  return ids;
}

function renderNewsTextWithoutYouTube(raw){
  const source=String(raw ?? '');
  const urlRegex=/(https?:\/\/[^\s<]+)/gi;
  let html='';
  let last=0;
  let m;

  while((m=urlRegex.exec(source))){
    html += escapeHTML(source.slice(last,m.index));

    let rawUrl=m[1];
    let trailing='';
    while(/[.,!?;:]$/.test(rawUrl)){
      trailing=rawUrl.slice(-1)+trailing;
      rawUrl=rawUrl.slice(0,-1);
    }

    const clean=safeNewsUrl(rawUrl);
    const yt=clean ? getYouTubeId(clean) : null;

    if(yt){
      // YouTube-URL nicht mehr im normalen Nachrichtentext anzeigen.
    }else if(clean){
      html += `<a class="news-link" href="${escapeHTML(clean)}" target="_blank" rel="noopener noreferrer">${escapeHTML(clean)}</a>`;
    }else{
      html += escapeHTML(m[1]);
    }

    if(!yt) html += escapeHTML(trailing);
    last=m.index+m[1].length;
  }

  html += escapeHTML(source.slice(last));

  return html
    .replace(/(?:<br>\s*){3,}/g,'<br><br>')
    .replace(/^(?:<br>\s*)+|(?:<br>\s*)+$/g,'')
    .trim();
}

function updateCountdowns(){
  document.querySelectorAll(".countdown[data-countdown-start]").forEach(el=>{
    const start=Number(el.dataset.countdownStart);
    let ms=start-Date.now();
    const value=el.querySelector(".countdown-value-live");
    const title=el.querySelector(".countdown-title");
    if(!value||!Number.isFinite(start))return;

    if(ms<=0){
      title.textContent="Status";
      value.className="countdown-value countdown-value-live started";
      value.textContent="🔴 STARTZEIT ERREICHT";
      return;
    }

    let s=Math.floor(ms/1000);
    const d=Math.floor(s/86400);
    s%=86400;
    const h=Math.floor(s/3600);
    s%=3600;
    const min=Math.floor(s/60);
    s%=60;

    title.textContent="⏳ Beginn in";
    value.className="countdown-value countdown-value-live";
    value.innerHTML=
      `<span>${d}</span> Tage · `+
      `<span>${String(h).padStart(2,"0")}</span> Stunden · `+
      `<span>${String(min).padStart(2,"0")}</span> Minuten · `+
      `<span>${String(s).padStart(2,"0")}</span> Sekunden`;
  });
}

let raidSignupContext = null;

function openSignup(type,id){
  const item=type==="raid"?raids.find(x=>x.id===id):events.find(x=>x.id===id);
  if(!item)return;

  openModal(`<h2>${type==="raid"?"⚔️ Raid-Anmeldung":"🎉 Event-Anmeldung"}</h2>
    <p class="muted">${escapeHTML(item.name)}</p>
    <div class="rk-signup-context">
      <strong>🔐 Anmeldung über dein Raidkader-Profil</strong><br>
      <span class="muted">Verwende den PIN, den du bei der Erstellung deines Raidkader-Profils vergeben hast. Danach kannst du einen deiner dort eingetragenen Charaktere auswählen.</span>
    </div>
    <div class="form-group">
      <label>Raidkader-PIN *</label>
      <input id="signupPin" inputmode="numeric" pattern="[0-9]{4,20}" maxlength="20" type="password" autocomplete="off" placeholder="4–20 Ziffern">
      <p class="signup-status-help">Du kannst dich nur mit einem bestehenden Raidkader-Profil anmelden.</p>
    </div>
    <p id="raidSignupNoProfileHint" class="signup-roster-hint"><strong>Noch kein Raidkader-Profil?</strong class="raidkader-login-hint"> Du kannst dich erst für ein Raid / Event anmelden, wenn du dich in den Raidkader eingetragen hast.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="verifyRaidSignupPin('${type}',${id})">Weiter</button>
    </div>`);
}

async function verifyRaidSignupPin(type,id){
  const pin=normalizeName(document.getElementById("signupPin")?.value);
  if(!pinIsValid(pin)){
    alert("Bitte deinen 4–20-stelligen Raidkader-PIN eingeben.");
    return;
  }

  const {data,error}=await supabaseClient.rpc("get_raidkader_signup_context",{p_pin:pin});
  if(error){dbError(error);return;}
  if(!data?.ok){
    alert(data?.message||"Kein Raidkader-Profil mit diesem PIN gefunden.");
    return;
  }

  const chars=Array.isArray(data.characters)?data.characters:[];
  if(!chars.length){
    alert("Zu diesem Raidkader-Profil wurden keine Charaktere gefunden.");
    return;
  }

  raidSignupContext={type,id,pin,player:data.player_name,characters:chars};
  renderRaidSignupForm();
}

function renderRaidSignupForm(){
  if(!raidSignupContext)return;
  const {type,id,pin,player,characters}=raidSignupContext;
  const item=type==="raid"?raids.find(x=>x.id===id):events.find(x=>x.id===id);
  if(!item)return;

  const options=characters.map((c,i)=>`<option value="${i}">${escapeHTML(c.character_name)} · ${escapeHTML(c.class_name)} · ${escapeHTML(c.spec)}</option>`).join("");

  openModal(`<h2>${type==="raid"?"⚔️ Raid-Anmeldung":"🎉 Event-Anmeldung"}</h2>
    <p class="muted">${escapeHTML(item.name)}</p>

    <div class="rk-signup-context">
      <strong>👤 Spielerprofil: ${escapeHTML(player)}</strong><br>
      <span class="muted">Dein Raidkader-PIN wurde bestätigt. Wähle jetzt den Charakter, mit dem du dich anmelden möchtest.</span>
    </div>

    <div class="form-group">
      <label>Charakter *</label>
      <select id="signupCharacterSelect" onchange="updateRaidSignupCharacter()">${options}</select>
    </div>

    <div class="form-group rk-signup-readonly">
      <label>Klasse</label>
      <input id="signupClassDisplay" readonly>
    </div>

    <div class="form-group rk-signup-readonly">
      <label>Spezialisierung</label>
      <input id="signupSpecDisplay" readonly>
    </div>

    <div class="form-group rk-signup-readonly">
      <label>Rolle</label>
      <input id="signupRoleDisplay" readonly>
    </div>

    <div class="form-group">
      <label>Status *</label>
      <select id="signupStatus">
        <option value="confirmed">✅ Dabei</option>
        <option value="bench">🪑 Ersatzbank</option>
        <option value="uncertain">❓ Unsicher</option>
        <option value="absent">🚫 Abwesend</option>
      </select>
      <p class="signup-status-help">„Dabei“ zählt für das Rollenlimit. Bank, Unsicher und Abwesend werden separat angezeigt und belegen keinen festen Platz.</p>
    </div>

    <div class="form-group rk-signup-readonly">
      <label>Raidkader-PIN</label>
      <input value="${escapeHTML(pin)}" readonly type="password">
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="openSignup('${type}',${id})">↩ Zurück</button>
      <button class="btn btn-primary" onclick="saveRaidkaderSignup()">💾 Anmeldung speichern</button>
    </div>`);

  updateRaidSignupCharacter();
}

function updateRaidSignupCharacter(){
  if(!raidSignupContext)return;
  const idx=Number(document.getElementById("signupCharacterSelect")?.value||0);
  const c=raidSignupContext.characters[idx];
  if(!c)return;
  const classEl=document.getElementById("signupClassDisplay");
  const specEl=document.getElementById("signupSpecDisplay");
  const roleEl=document.getElementById("signupRoleDisplay");
  if(classEl)classEl.value=c.class_name||"";
  if(specEl)specEl.value=c.spec||"";
  if(roleEl)roleEl.value=c.role||"";
}

async function saveRaidkaderSignup(){
  if(!raidSignupContext)return;

  const {type,id,pin,player,characters}=raidSignupContext;
  const idx=Number(document.getElementById("signupCharacterSelect")?.value||0);
  const c=characters[idx];
  const status=document.getElementById("signupStatus")?.value;

  if(!c){
    alert("Bitte einen Charakter auswählen.");
    return;
  }

  const {data,error}=await supabaseClient.rpc("register_signup_from_raidkader",{
    p_item_type:type,
    p_item_id:id,
    p_raidkader_id:c.id,
    p_pin:pin,
    p_status:status
  });

  if(error){dbError(error);return;}

  if(data?.ok===false){
    if(data?.needs_bench){
      const ok=confirm((data.message||"Für diese Rolle ist kein fester Platz mehr frei.")+"\n\nMöchtest du stattdessen auf die Ersatzbank?");
      if(!ok){showToast("Anmeldung nicht gespeichert.");return;}

      const retry=await supabaseClient.rpc("register_signup_from_raidkader",{
        p_item_type:type,
        p_item_id:id,
        p_raidkader_id:c.id,
        p_pin:pin,
        p_status:"bench"
      });
      if(retry.error){dbError(retry.error);return;}
      if(!retry.data?.ok){alert(retry.data?.message||"Anmeldung konnte nicht gespeichert werden.");return;}
    }else{
      alert(data.message||"Anmeldung konnte nicht gespeichert werden.");
      return;
    }
  }

  raidSignupContext=null;
  closeModal();
  await refreshData();
  showToast(type==="raid"?"⚔️ Status für den Raid gespeichert.":"🎉 Status für das Event gespeichert.");
}

function updateSpecs(){const c=document.getElementById("signupClass"),s=document.getElementById("signupSpec");if(!c||!s)return;s.innerHTML=wowClasses[c.value].map(([spec,role])=>`<option value="${escapeHTML(spec)}" data-role="${role}">${escapeHTML(spec)} – ${escapeHTML(role)}</option>`).join("");}
async function submitSignup(type,payload){
 const {data,error}=await supabaseClient.rpc("register_signup_status",payload);
 if(error){alert("Anmeldung fehlgeschlagen: "+error.message);return null;}
 if(data?.ok===false)return data;
 if(data?.signup_token)rememberSignupToken(type,payload.p_item_id,data.signup_token);
 closeModal();await refreshData();
 showToast(type==="raid"?"⚔️ Status für den Raid gespeichert.":"🎉 Status für das Event gespeichert.");
 return data||{ok:true};
}
async function saveSignup(type,id){
  const player=document.getElementById("signupPlayer").value.trim(),character=document.getElementById("signupCharacter").value.trim(),
    className=document.getElementById("signupClass").value,specEl=document.getElementById("signupSpec"),spec=specEl.value,
    role=specEl.selectedOptions[0]?.dataset.role,status=document.getElementById("signupStatus").value,
    pin=document.getElementById("signupPin").value.trim();
  if(!player||!character){alert("Bitte Spieler- und Charaktername eingeben.");return;}
  if(!pinIsValid(pin)){alert("Der persönliche PIN muss aus 4 bis 20 Ziffern bestehen.");return;}
  const payload={p_item_type:type,p_item_id:id,p_player:player,p_character:character,p_class_name:className,p_spec:spec,p_role:role,p_status:status,p_pin:pin};
  let result=await submitSignup(type,payload);if(!result)return;
  if(result.needs_bench){
    const ok=confirm((result.message||"Für diese Rolle ist kein fester Platz mehr frei.")+"\n\nMöchtest du stattdessen auf die Ersatzbank?");
    if(!ok){showToast("Anmeldung nicht gespeichert.");return;}
    payload.p_status="bench";await submitSignup(type,payload);
  }
}

let raidKaderRows=[];
let raidKaderVerifiedPlayer="";
let raidKaderVerifiedPin="";
let raidKaderFormMode="create";
let raidKaderManagePlayer="";
let raidKaderManagePin="";

function updateRaidkaderSpecs(){
  const cls=document.getElementById("rkClass");
  const spec=document.getElementById("rkSpec");
  const role=document.getElementById("rkRole");
  if(!cls||!spec||!role)return;

  const entries=wowClasses[cls.value]||[];

  spec.innerHTML='<option value="">Spezialisierung wählen</option>';
  role.innerHTML='<option value="">Wird automatisch gesetzt</option>';
  role.value="";

  entries.forEach(([specName, roleName])=>{
    const option=new Option(specName,specName);
    option.dataset.role=roleName;
    spec.add(option);
  });

  // Nach der Klassenauswahl direkt die erste MoP-Spezialisierung
  // auswählen und deren Rolle anzeigen.
  if(entries.length){
    spec.value=entries[0][0];
    role.innerHTML=`<option value="${entries[0][1]}">${entries[0][1]}</option>`;
    role.value=entries[0][1];
  }

  spec.onchange=function(){
    const found=entries.find(([specName])=>specName===spec.value);
    if(found){
      role.innerHTML=`<option value="${found[1]}">${found[1]}</option>`;
      role.value=found[1];
    }else{
      role.innerHTML='<option value="">Wird automatisch gesetzt</option>';
      role.value="";
    }
  };
}

function resetRaidkaderForm(){
  ["rkName","rkChar","rkIlvl","rkPin"].forEach(id=>{
    const el=document.getElementById(id); if(el)el.value="";
  });
  const cls=document.getElementById("rkClass"), spec=document.getElementById("rkSpec"), role=document.getElementById("rkRole");
  if(cls)cls.value="";
  if(spec)spec.innerHTML='<option value="">Zuerst Klasse auswählen</option>';
  if(role)role.innerHTML='<option value="">Wird automatisch gesetzt</option>';
}

async function loadRaidkader(){
  if(!supabaseClient)return;
  const {data,error}=await supabaseClient
    .from("raidkader")
    .select("id,player_name,character_name,class_name,spec,role,item_level,created_at,updated_at")
    .order("player_name",{ascending:true})
    .order("item_level",{ascending:false});
  if(error){
    console.error("Raidkader laden:",error);
    document.getElementById("rosterContainer").innerHTML=
      `<div class="raid-card"><div class="card-body">Raidkader konnte nicht geladen werden.<br><small>${escapeHTML(error.message)}</small></div></div>`;
    return;
  }
  raidKaderRows=data||[];
  renderRoster();
}

function roleClass(role){
  return role==="Tank"?"rk-role-tank":role==="Heiler"?"rk-role-heiler":"rk-role-dd";
}
function classClass(name){
  const map={"Todesritter":"rk-class-dk","Druide":"rk-class-druid","Jäger":"rk-class-hunter","Magier":"rk-class-mage","Mönch":"rk-class-monk","Paladin":"rk-class-paladin","Priester":"rk-class-priest","Schamane":"rk-class-shaman","Schurke":"rk-class-rogue","Hexenmeister":"rk-class-warlock","Krieger":"rk-class-warrior"};
  return map[name]||"";
}

function renderRoster(){
  const container=document.getElementById("rosterContainer");
  if(!container)return;
  if(!raidKaderRows.length){
    container.innerHTML='<div class="raid-card"><div class="card-body rk-empty">Noch keine Charaktere im Raidkader.</div></div>';
    return;
  }

  const groups={};
  raidKaderRows.forEach(row=>{
    const key=row.player_name.trim().toLowerCase();
    if(!groups[key])groups[key]={name:row.player_name,rows:[]};
    groups[key].rows.push(row);
  });

  container.innerHTML=Object.values(groups).map(group=>{
    const rows=group.rows.map(row=>`
      <tr>
        <td class="rk-char-name">${escapeHTML(row.character_name)}</td>
        <td class="rk-class-name ${classClass(row.class_name)}">${escapeHTML(row.class_name)}</td>
        <td class="rk-spec-name">${escapeHTML(row.spec)}</td>
        <td><span class="rk-role-badge ${roleClass(row.role)}">${escapeHTML(row.role)}</span></td>
        <td class="rk-ilvl">${escapeHTML(String(row.item_level))}</td>
        <td class="rk-actions-cell">
          ${isAdmin
            ? `<button class="btn btn-secondary btn-small" onclick="adminEditRaidkader(${row.id})">✏️</button>
               <button class="btn btn-danger btn-small" onclick="adminDeleteRaidkader(${row.id})">🗑️</button>`
            : `<span class="muted">—</span>`}
        </td>
      </tr>`).join("");

    return `<article class="rk-player-card">
      <div class="rk-player-head">
        <div>
          <div class="rk-player-name">👤 ${escapeHTML(group.name)}</div>
          <div class="rk-player-meta">${group.rows.length} Charakter${group.rows.length===1?"":"e"} im Raidkader</div>
        </div>
        <div class="rk-player-actions">
          <button class="btn btn-secondary btn-small" onclick='openRaidkaderManageFor(${JSON.stringify(group.name)})'>🔑 Meine Charaktere verwalten</button>
          <button class="btn btn-primary btn-small" onclick='openRaidkaderAddFor(${JSON.stringify(group.name)})'>➕ Charakter hinzufügen</button>
        </div>
      </div>
      <div class="rk-table-wrap">
        <table class="rk-table">
          <thead><tr><th>Charakter</th><th>Klasse</th><th>Spec</th><th>Rolle</th><th>GS</th><th>Verwaltung</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </article>`;
  }).join("");
}

  const isAdd=mode==="add";

  openModal(`<div class="rk-modal">
    <div class="modal-title">
      <div>
        <h2>${isAdd?"👤 Charakter hinzufügen":"👤 Raidprofil hinzufügen"}</h2>
        <p>${isAdd
          ?"Füge deinem bestehenden Spielerprofil einen weiteren Charakter hinzu."
          :"Lege dein Spielerprofil an. Deinen PIN legst du nur einmal fest und benötigst ihn später für weitere Charaktere und die Verwaltung."}</p>
      </div>
      <span class="rk-mop-badge">🐼 Mists of Pandaria Classic</span>
    </div>

    <div class="rk-profile-note">
      ${isAdd
        ? `<strong>🔐 Profil geschützt</strong><span>Spieler: ${escapeHTML(preset)} · Dein bestehender PIN wurde bereits bestätigt.</span>`
        : `<strong>🔐 Ein PIN pro Spielerprofil</strong><span>Der PIN wird einmalig für deinen Spielernamen gespeichert. Für weitere Charaktere wird derselbe PIN verwendet.</span>`}
    </div>

    <div class="rk-modal-grid">
      <div class="form-group">
        <label for="rkName">Name *</label>
        <input id="rkName" autocomplete="name" value="${escapeHTML(preset)}" ${isAdd?"readonly":""} placeholder="z. B. Toni">
      </div>
      <div class="form-group">
        <label for="rkChar">Charaktername *</label>
        <input id="rkChar" placeholder="z. B. Dr.Mett">

      <div class="form-group">
        <label for="rkClass">Klasse *</label>
        <select id="rkClass" onchange="updateRaidkaderSpecs()">
          <option value="">Klasse wählen</option>
          <option>Todesritter</option><option>Druide</option><option>Jäger</option><option>Magier</option>
          <option>Mönch</option><option>Paladin</option><option>Priester</option><option>Schamane</option>
          <option>Schurke</option><option>Hexenmeister</option><option>Krieger</option>
        </select>

        <label for="rkRole">Rolle</label>
        <select id="rkRole" disabled><option value="">Wird automatisch gesetzt</option></select>

        <label for="rkIlvl">Gegenstandsstufe *</label>
        <input id="rkIlvl" type="number" min="1" max="999" placeholder="z. B. 553">
      </div>
      ${isAdd ? "" : `<div class="form-group rk-pin-group">
        <label for="rkPin">Persönlicher PIN *</label>
        <input id="rkPin" type="password" inputmode="numeric" maxlength="20" autocomplete="new-password" placeholder="4–20 Ziffern">
        <small>Diesen PIN nur einmal festlegen. Bewahre ihn gut auf.</small>
      </div>`}
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveRoster()">${isAdd?"➕ Charakter hinzufügen":"➕ Profil & Charakter speichern"}</button>
    </div>
  </div>`);

  if(preset)document.getElementById("rkName").focus();
}

async function saveRoster(){
  const player=document.getElementById("rkName").value.trim();
  const character=document.getElementById("rkChar").value.trim();
  const className=document.getElementById("rkClass").value;
  const spec=document.getElementById("rkSpec").value;
  const selectedSpec=spec;
  const roleEntry=(wowClasses[className]||[]).find(([specName])=>specName===selectedSpec);
  const role=roleEntry ? roleEntry[1] : "";
  const ilvl=Number(document.getElementById("rkIlvl").value);

  if(!player||!character||!className||!spec||!role||!ilvl){
    alert("Bitte Name, Charakter, Klasse, Spezialisierung und Gegenstandsstufe ausfüllen.");
    return;
  }

  if(raidKaderFormMode==="add"){
    if(!raidKaderVerifiedPlayer || !raidKaderVerifiedPin){
      alert("Bitte zuerst deinen PIN bestätigen.");
      return;
    }

    const {data,error}=await supabaseClient.rpc("add_raidkader_character",{
      p_player_name:raidKaderVerifiedPlayer,
      p_pin:raidKaderVerifiedPin,
      p_character_name:character,
      p_class_name:className,
      p_spec:spec,
      p_role:role,
      p_item_level:ilvl
    });
    if(error){alert("Charakter konnte nicht gespeichert werden: "+error.message);return;}
    if(data?.ok===false){alert(data.message||"Charakter konnte nicht gespeichert werden.");return;}

    closeModal();
    await loadRaidkader();
    showToast("👤 Weiterer Charakter wurde hinzugefügt.");
    return;
  }

  const pin=document.getElementById("rkPin")?.value.trim()||"";
  if(!/^\d{4,20}$/.test(pin)){
    alert("Bitte einen 4–20-stelligen PIN festlegen.");
    return;
  }

  const {data,error}=await supabaseClient.rpc("create_raidkader_profile",{
    p_player_name:player,
    p_character_name:character,
    p_class_name:className,
    p_spec:spec,
    p_role:role,
    p_item_level:ilvl,
    p_pin:pin
  });
  if(error){alert("Profil konnte nicht erstellt werden: "+error.message);return;}
  if(data?.ok===false){alert(data.message||"Profil konnte nicht erstellt werden.");return;}

  raidKaderVerifiedPlayer=player;
  raidKaderVerifiedPin=pin;
  closeModal();
  await loadRaidkader();
  showToast("👤 Profil und erster Charakter wurden erstellt.");
}

function openRaidkaderAddFor(playerName){
  const player=(playerName||"").trim();
  if(!player)return;

  openModal(`<h2>🔑 PIN erforderlich</h2>
    <p class="muted">Für <strong>${escapeHTML(player)}</strong> wurde bereits ein Profil angelegt. Gib den einmal festgelegten PIN ein, um einen weiteren Charakter hinzuzufügen.</p>
    <div class="form-group">
      <label>Persönlicher PIN</label>
      <input id="rkAddPin" type="password" inputmode="numeric" maxlength="20" placeholder="4–20 Ziffern">
    </div>

      <button class="btn btn-primary" onclick='verifyPinForAdd(${JSON.stringify(player)})'>🔓 PIN bestätigen</button>

}

async function verifyPinForAdd(player){
  const pin=document.getElementById("rkAddPin")?.value.trim()||"";
  if(!/^\d{4,20}$/.test(pin)){
    alert("Bitte deinen 4–6-stelligen PIN eingeben.");
    return;
  }

  const {data,error}=await supabaseClient.rpc("get_my_raidkader",{p_player_name:player,p_pin:pin});
  if(error){alert("PIN-Prüfung fehlgeschlagen: "+error.message);return;}
  if(!data?.length){alert("PIN falsch oder Profil nicht gefunden.");return;}

  raidKaderVerifiedPlayer=player;
  raidKaderVerifiedPin=pin;
  closeModal();
  openRaidkaderForm(player,"add");
}

  const player=(playerName||"").trim();

    <p class="muted">Bestätige deinen persönlichen PIN für <strong>${escapeHTML(player)}</strong>. Danach kannst du deine Charaktere bearbeiten, löschen oder weitere hinzufügen.</p>

async function openRaidkaderManage(){
  openModal(`<h2>🔑 Meine Raidkader-Einträge</h2>
    <p class="muted">Gib deinen Spielernamen und deinen persönlichen PIN ein. Danach kannst du alle deine Charaktere bearbeiten, löschen oder einen weiteren hinzufügen.</p>
    <div class="form-group"><label>Spielername</label><input id="rkManagePlayer" placeholder="z. B. Toni"></div>
    <div class="form-group"><label>PIN</label><input id="rkManagePin" type="password" inputmode="numeric" maxlength="20" placeholder="4–20 Ziffern"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="verifyRaidkaderManage()">🔓 Einträge anzeigen</button>
    </div>`);
}

async function verifyRaidkaderManage(){
  const player=document.getElementById("rkManagePlayer").value.trim();
  const pin=document.getElementById("rkManagePin").value.trim();
  if(!player||!/^\d{4,20}$/.test(pin)){alert("Bitte Spielername und 4–6-stelligen PIN eingeben.");return;}

  const {data,error}=await supabaseClient.rpc("get_my_raidkader",{p_player_name:player,p_pin:pin});
  if(error){alert("Verwaltung konnte nicht geöffnet werden: "+error.message);return;}
  if(!data?.length){alert("Keine Einträge gefunden oder PIN ist falsch.");return;}

  raidKaderManagePlayer=player;
  raidKaderManagePin=pin;

  const items=data.map(row=>`
    <div class="rk-manage-item">
      <div><strong>${escapeHTML(row.character_name)}</strong><span>${escapeHTML(row.class_name)} · ${escapeHTML(row.spec)} · ${escapeHTML(row.item_level)} GS</span></div>
      <div>
        <button class="btn btn-secondary btn-small" onclick='openRaidkaderEdit(${JSON.stringify(row)})'>✏️</button>
        <button class="btn btn-danger btn-small" onclick="deleteMyRaidkader(${row.id})">🗑️</button>
      </div>
    </div>`).join("");

  openModal(`<h2>👤 ${escapeHTML(player)} – Charaktere</h2>
    <div class="rk-manage-list">${items}</div>
    <p class="rk-muted-note">Dein PIN bleibt nur für diese Verwaltungssitzung im Browser verfügbar.</p>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="closeModal();openRaidkaderForm(${JSON.stringify(player)},"add")">➕ Weiteren Charakter hinzufügen</button>
      <button class="btn btn-secondary" onclick="closeModal()">Schließen</button>
    </div>`);
}

function openRaidkaderEdit(row){
  const classOptions=Object.keys(wowClasses).map(c=>`<option value="${escapeHTML(c)}" ${c===row.class_name?"selected":""}>${escapeHTML(c)}</option>`).join("");
  openModal(`<h2>✏️ ${escapeHTML(row.character_name)} bearbeiten</h2>
    <div class="form-row">
      <div class="form-group"><label>Spielername</label><input id="rkePlayer" value="${escapeHTML(raidKaderManagePlayer)}" readonly></div>
      <div class="form-group"><label>Charaktername</label><input id="rkeChar" value="${escapeHTML(row.character_name)}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Klasse</label><select id="rkeClass" onchange="updateEditSpecs()">${classOptions}</select></div>
      <div class="form-group"><label>Spezialisierung</label><select id="rkeSpec"></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Rolle</label><select id="rkeRole" disabled></select></div>
      <div class="form-group"><label>Gegenstandsstufe</label><input id="rkeIlvl" type="number" min="1" max="999" value="${escapeHTML(String(row.item_level))}"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="verifyRaidkaderManage()">↩ Zurück</button>
      <button class="btn btn-primary" onclick="saveMyRaidkaderEdit(${row.id})">💾 Speichern</button>
    </div>`);
  const sel=document.getElementById("rkeSpec");
  sel.dataset.wanted=row.spec;
  updateEditSpecs();
}

function updateEditSpecs(){
  const cls=document.getElementById("rkeClass"),spec=document.getElementById("rkeSpec"),role=document.getElementById("rkeRole");
  if(!cls||!spec||!role)return;
  const entries=wowClasses[cls.value]||[];
  spec.innerHTML='<option value="">Spezialisierung wählen</option>';
  entries.forEach(([s,r])=>{const o=new Option(s,s);o.dataset.role=r;spec.add(o);});
  if(spec.dataset.wanted && [...spec.options].some(o=>o.value===spec.dataset.wanted)){
    spec.value=spec.dataset.wanted;
  }
  role.innerHTML='<option value="">Rolle</option>';
  const found=entries.find(x=>x[0]===spec.value);
  if(found)role.add(new Option(found[1],found[1]));
  role.value=found?.[1]||"";
  spec.onchange=()=>{
    const f=entries.find(x=>x[0]===spec.value);
    role.innerHTML=f?`<option value="${f[1]}">${f[1]}</option>`:'<option value="">Rolle</option>';
    role.value=f?.[1]||"";
  };
}

async function saveMyRaidkaderEdit(id){
  const character=document.getElementById("rkeChar").value.trim();
  const className=document.getElementById("rkeClass").value;
  const spec=document.getElementById("rkeSpec").value;
  const role=document.getElementById("rkeRole").value;
  const ilvl=Number(document.getElementById("rkeIlvl").value);
  if(!character||!className||!spec||!role||!ilvl){alert("Bitte alle Felder ausfüllen.");return;}

  const {data,error}=await supabaseClient.rpc("update_my_raidkader",{
    p_id:Number(id),p_player_name:raidKaderManagePlayer,p_pin:raidKaderManagePin,
    p_character_name:character,p_class_name:className,p_spec:spec,p_role:role,p_item_level:ilvl
  });
  if(error){alert("Änderung fehlgeschlagen: "+error.message);return;}
  if(data?.ok===false){alert(data.message||"Änderung fehlgeschlagen.");return;}
  await loadRaidkader();
  await verifyRaidkaderManage();
  showToast("✏️ Charakter aktualisiert.");
}

async function deleteMyRaidkader(id){
  if(!confirm("Diesen Charakter wirklich löschen?"))return;
  const {data,error}=await supabaseClient.rpc("delete_my_raidkader",{
    p_id:Number(id),p_player_name:raidKaderManagePlayer,p_pin:raidKaderManagePin
  });
  if(error){alert("Löschen fehlgeschlagen: "+error.message);return;}
  if(data?.ok===false){alert(data.message||"Löschen fehlgeschlagen.");return;}
  await loadRaidkader();
  const remaining=raidKaderRows.filter(r=>r.player_name.trim().toLowerCase()===raidKaderManagePlayer.trim().toLowerCase());
  if(remaining.length) await verifyRaidkaderManage(); else closeModal();
  showToast("🗑️ Charakter gelöscht.");
}
